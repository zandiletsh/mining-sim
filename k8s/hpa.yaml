# Adds pods when the API is busy, removes them when it is quiet.
# K3s ships with metrics-server, which supplies the CPU numbers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opsbrain-api
  namespace: opsbrain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opsbrain-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
