name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the compose file is valid
        run: docker compose config -q
      - name: Build the image
        run: docker build -t opsbrain-api .
      - name: Start it and check it answers
        run: |
          docker run -d --name opsbrain -p 8000:8000 opsbrain-api
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs opsbrain
          exit 1

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the manifests
        run: kubectl kustomize k8s > rendered.yaml
      - name: Check them against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml
